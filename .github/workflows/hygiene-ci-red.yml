# Cost class: schedule/event (caller-defined)
name: hygiene-ci-red

on:
  workflow_call:
    inputs:
      workflow_names:
        description: JSON array of workflow file names (e.g. canon-check.yml)
        type: string
        required: true
      owners_json:
        description: JSON map workflow_file -> {label, assignee}
        type: string
        default: "{}"
      default_branch:
        type: string
        default: main

permissions: {}

jobs:
  ci-red:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C4_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - name: Track consecutive failures
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          WORKFLOW_NAMES: ${{ inputs.workflow_names }}
          OWNERS_JSON: ${{ inputs.owners_json }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C4_MODE }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          # Floor never_allowlist (manifest may extend; hygiene always applies proposed_additions).
          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref):
              try:
                  raw = call(
                      f"/repos/{repo}/contents/{urllib.parse.quote(MANIFEST, safe='')}?ref={urllib.parse.quote(ref, safe='')}",
                      accept="application/vnd.github.raw",
                  )
                  data = json.loads(raw)
              except (HygieneAPIError, json.JSONDecodeError, TypeError):
                  return list(FLOOR_DENIED), set(FLOOR_NEVER_ALLOWLIST)
              dp = (data.get("denied_paths") or {}) if isinstance(data, dict) else {}
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C4 ci-red issue tracker for consecutive workflow failures on default branch."""
          import json
          import os
          import re


          MODE = "hygiene-c4-ci-red"
          MARKER_RE = re.compile(r"<!--\s*hygiene:ci-red:(?P<repo>[^:]+):(?P<wf>\d+)\s*-->")


          def env(name, default=""):
              return os.environ.get(name, default)


          def parse_owners(raw):
              try:
                  return json.loads(raw or "{}")
              except json.JSONDecodeError:
                  return {}


          def run_is_failure(run):
              if run.get("conclusion") in ("cancelled", "skipped", "neutral"):
                  return None
              if run.get("conclusion") in ("failure", "timed_out"):
                  return True
              if run.get("conclusion") == "success":
                  return False
              return None


          def last_two_runs(token, repo, workflow_id, branch):
              data = call(
                  f"/repos/{repo}/actions/workflows/{workflow_id}/runs?branch={branch}&status=completed&per_page=2",
                  token=token,
              )
              runs = (data or {}).get("workflow_runs") or []
              return runs[:2]


          def find_issue(token, repo, marker):
              issues = paginate(f"/repos/{repo}/issues?state=open&labels=ci-red", token=token, cap=10)
              for issue in issues:
                  if marker in (issue.get("body") or ""):
                      return issue
              return None


          def ensure_labels(token, repo, labels):
              for lab in labels:
                  call(f"/repos/{repo}/labels/{lab}", token=token, allow_404=True)


          def process_workflow(token, repo, wf_name, wf_id, branch, owners, default_label):
              marker = f"<!-- hygiene:ci-red:{repo}:{wf_id} -->"
              runs = last_two_runs(token, repo, wf_id, branch)
              outcomes = [run_is_failure(r) for r in runs]
              outcomes = [o for o in outcomes if o is not None]
              consecutive = 0
              for o in outcomes:
                  if o:
                      consecutive += 1
                  else:
                      break
              action = "none"
              if len(outcomes) >= 2 and outcomes[0] and outcomes[1]:
                  action = "open_or_update"
              elif outcomes and outcomes[0] is False:
                  action = "close"
              elif len(outcomes) == 1 and outcomes[0]:
                  action = "none"
                  print(f"consecutive=1 action=none workflow={wf_name}")
                  return
              print(f"workflow={wf_name} consecutive={consecutive} action={action}")

              owner_cfg = owners.get(wf_name) or owners.get(f"{wf_name}.yml") or {}
              label = owner_cfg.get("label") or default_label
              assignee = owner_cfg.get("assignee")

              issue = find_issue(token, repo, marker)
              if action == "close" and issue:
                  if dry_run():
                      print(f"DRY-RUN close issue #{issue['number']}")
                      return
                  call(
                      f"/repos/{repo}/issues/{issue['number']}",
                      token=token,
                      method="PATCH",
                      body={"state": "closed"},
                  )
                  call(
                      f"/repos/{repo}/issues/{issue['number']}/comments",
                      token=token,
                      method="POST",
                      body={"body": f"Closed: green run {runs[0].get('html_url')}"},
                  )
                  return
              if action != "open_or_update":
                  return
              title = f"ci-red: {wf_name} on {branch}"
              fail_count = sum(1 for r in runs if run_is_failure(r))
              body = (
                  f"{marker}\n"
                  f"Consecutive failures: {fail_count}\n"
                  f"Latest: {runs[0].get('html_url')} @ `{runs[0].get('head_sha', '')[:7]}`\n"
              )
              labels = ["ci-red", label]
              if dry_run():
                  print(f"DRY-RUN issue {title}")
                  return
              if issue:
                  call(
                      f"/repos/{repo}/issues/{issue['number']}",
                      token=token,
                      method="PATCH",
                      body={"body": body},
                  )
                  call(
                      f"/repos/{repo}/issues/{issue['number']}/comments",
                      token=token,
                      method="POST",
                      body={"body": f"Still failing: {runs[0].get('html_url')}"},
                  )
              else:
                  payload = {"title": title, "body": body, "labels": labels}
                  if assignee:
                      payload["assignees"] = [assignee]
                  call(f"/repos/{repo}/issues", token=token, method="POST", body=payload)


          def main():
              token = env("GH_TOKEN")
              repo = env("REPO")
              branch = env("DEFAULT_BRANCH", "main")
              wf_json = env("WORKFLOW_NAMES", "[]")
              owners = parse_owners(env("OWNERS_JSON"))
              if not token:
                  fail(MODE, "GH_TOKEN missing")
              try:
                  names = json.loads(wf_json)
              except json.JSONDecodeError:
                  fail(MODE, "WORKFLOW_NAMES must be JSON array")
              for name in names:
                  wf = call(f"/repos/{repo}/actions/workflows/{name}", token=token, allow_404=True)
                  if not wf:
                      print(f"skip missing workflow {name}")
                      continue
                  process_workflow(token, repo, name, wf["id"], branch, owners, "owner:madengineer")


          if __name__ == "__main__":
              main()
          PY
