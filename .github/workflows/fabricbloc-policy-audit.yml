# Cost class: scheduled
#
# Daily drift check for org/repo rulesets and GitHub App installations.
# NEVER pull_request / pull_request_target: this repo is public.
name: fabricbloc-policy-audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Mint policy-audit App installation token
        id: app-token
        uses: actions/create-github-app-token@5d869da34bd18d17bfe4e1d7cb9ae5add0af7b67 # v1.6.4
        with:
          app-id: ${{ secrets.POLICY_AUDIT_APP_ID }}
          private-key: ${{ secrets.POLICY_AUDIT_APP_PRIVATE_KEY }}
          owner: BloclabsHQ
      - name: Compare live policy state to committed snapshots
        env:
          POLICY_AUDIT_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT_OUT: ${{ runner.temp }}/live-snapshot.json
        run: python3 agent-gates/policy_audit_snapshot.py
      - name: Upload live snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-audit-live-snapshot
          path: ${{ runner.temp }}/live-snapshot.json
          if-no-files-found: ignore
