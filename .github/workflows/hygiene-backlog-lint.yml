# Cost class: schedule/event (caller-defined)
name: hygiene-backlog-lint

on:
  workflow_call:
    inputs:
      template_ref:
        description: Git ref for GATE-CHECKLIST.md in fabricbloc
        type: string
        required: true
      template_repo:
        type: string
        default: BloclabsHQ/fabricbloc
      template_path:
        type: string
        default: templates/spec/GATE-CHECKLIST.md
      needs_pr_days:
        type: string
        default: "3"

permissions: {}

jobs:
  lint:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C6_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Backlog lint
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TEMPLATE_REPO: ${{ inputs.template_repo }}
          TEMPLATE_REF: ${{ inputs.template_ref }}
          TEMPLATE_PATH: ${{ inputs.template_path }}
          NEEDS_PR_DAYS: ${{ inputs.needs_pr_days }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C6_MODE }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          # Floor never_allowlist (manifest may extend; hygiene always applies proposed_additions).
          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref):
              try:
                  raw = call(
                      f"/repos/{repo}/contents/{urllib.parse.quote(MANIFEST, safe='')}?ref={urllib.parse.quote(ref, safe='')}",
                      accept="application/vnd.github.raw",
                  )
                  data = json.loads(raw)
              except (HygieneAPIError, json.JSONDecodeError, TypeError):
                  return list(FLOOR_DENIED), set(FLOOR_NEVER_ALLOWLIST)
              dp = (data.get("denied_paths") or {}) if isinstance(data, dict) else {}
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C6 delegate-spec backlog lint (issues API + pinned checklist template)."""
          import os
          import re
          from datetime import datetime, timezone


          MODE = "hygiene-c6-backlog-lint"
          LIFECYCLE = frozenset({"spec:draft", "spec:gate", "spec:ready", "in-progress", "blocked"})
          MARKER = "<!-- hygiene:c6:lint -->"
          TARGET_RE = re.compile(r"Target:\s*([\w.-]+/[\w.-]+)\s*·\s*lane:\s*(\S+)")
          IMPL_RE = re.compile(r"Implementation PR:\s*https://github\.com/[\w.-]+/[\w.-]+/pull/\d+", re.I)
          SPEC_PATH_RE = re.compile(r"docs/specs/\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.md")
          ROW_RE = re.compile(r"^\s*-\s*\[(PASS|FAIL)\]\s*(R\d+|D\d+|W\d+|S\d+|T\d+|M\d+)\b", re.M | re.I)


          def env(name, default=""):
              return os.environ.get(name, default)


          def load_template(token, repo, ref, path):
              raw = call(
                  f"/repos/{repo}/contents/{path}?ref={ref}",
                  token=token,
                  accept="application/vnd.github.raw",
              )
              return raw if isinstance(raw, str) else ""


          def row_ids_from_template(text):
              return sorted(set(m.group(2).upper() for m in ROW_RE.finditer(text or "")))


          def lifecycle_labels(labels):
              names = [l.get("name") for l in labels or [] if l.get("name") in LIFECYCLE and l.get("name") != "blocked"]
              return names


          def lint_issue(token, repo, issue, template_rows, needs_pr_days):
              num = issue["number"]
              body = issue.get("body") or ""
              labels = issue.get("labels") or []
              fails = []
              life = lifecycle_labels(labels)
              if len(life) > 1:
                  fails.append("W3:multiple-lifecycle")
              assignees = issue.get("assignees") or []
              if len(assignees) != 1:
                  fails.append("R1:assignee")
              if not TARGET_RE.search(body):
                  fails.append("R2:target-lane")
              life_set = {l.get("name") for l in labels}
              if "in-progress" in life_set and not IMPL_RE.search(body):
                  fails.append("R3:implementation-pr")
              if life_set & {"spec:gate", "spec:ready", "in-progress"}:
                  for rid in template_rows:
                      if rid.startswith("D") or rid.startswith("R") or rid.startswith("W"):
                          if not re.search(rf"\[(PASS|FAIL)\]\s*{rid}\b", body, re.I):
                              fails.append(f"{rid}:missing-row")
                  if not SPEC_PATH_RE.search(body):
                      fails.append("D1:spec-path")
              comment_body = MARKER + "\n" + "\n".join(f"FAIL {f}" for f in fails) if fails else MARKER + "\nPASS"
              comments = paginate(f"/repos/{repo}/issues/{num}/comments", token=token, cap=10)
              existing = next((c for c in comments if MARKER in (c.get("body") or "")), None)
              if existing:
                  if existing.get("body") != comment_body:
                      call(
                          f"/repos/{repo}/issues/comments/{existing['id']}",
                          token=token,
                          method="PATCH",
                          body={"body": comment_body},
                      )
              else:
                  call(f"/repos/{repo}/issues/{num}/comments", token=token, method="POST", body={"body": comment_body})

              if "in-progress" in life_set and not IMPL_RE.search(body):
                  # needs-pr from label age approximated via updated_at
                  updated = parse_ts(issue.get("updated_at"))
                  if updated and (datetime.now(timezone.utc) - updated).days >= needs_pr_days:
                      if "needs-pr" not in {l.get("name") for l in labels}:
                          call(
                              f"/repos/{repo}/issues/{num}/labels",
                              token=token,
                              method="POST",
                              body={"labels": ["needs-pr"]},
                          )
              elif "needs-pr" in {l.get("name") for l in labels} and IMPL_RE.search(body):
                  call(
                      f"/repos/{repo}/issues/{num}/labels/needs-pr",
                      token=token,
                      method="DELETE",
                      allow_404=True,
                  )


          def parse_ts(s):
              if not s:
                  return None
              s = s.replace("Z", "+0000")
              return datetime.strptime(s, "%Y-%m-%dT%H:%M:%S%f%z")


          def main():
              token = env("GH_TOKEN")
              repo = env("REPO")
              template_repo = env("TEMPLATE_REPO", "BloclabsHQ/fabricbloc")
              template_ref = env("TEMPLATE_REF", "main")
              template_path = env("TEMPLATE_PATH", "templates/spec/GATE-CHECKLIST.md")
              needs_pr_days = int(env("NEEDS_PR_DAYS", "3"))
              if not token:
                  fail(MODE, "GH_TOKEN missing")
              template = load_template(token, template_repo, template_ref, template_path)
              rows = row_ids_from_template(template)
              print(f"template_rows={rows}")
              issues = paginate(f"/repos/{repo}/issues?state=open&per_page=100", token=token, cap=10)
              for issue in issues:
                  if not ({l.get("name") for l in issue.get("labels") or []} & LIFECYCLE):
                      continue
                  lint_issue(token, repo, issue, rows, needs_pr_days)


          if __name__ == "__main__":
              main()
          PY
