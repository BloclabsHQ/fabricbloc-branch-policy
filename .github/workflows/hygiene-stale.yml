# Cost class: schedule (caller-defined)
name: hygiene-stale

on:
  workflow_call:
    inputs:
      pr_author:
        type: string
        default: Madgeniusblink
      pr_head_glob:
        type: string
        default: agent/**
      close_after:
        type: string
        default: "2026-10-12T00:00:00-07:00"
      exempt_base_refs:
        type: string
        default: f6-gate-test
      pr_stale_days:
        type: string
        default: "7"
      pr_close_days:
        type: string
        default: "14"
      default_branch:
        type: string
        default: main
    secrets:
      HYGIENE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  stale-prs:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C2_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Mint hygiene App token for PR close (K10 / T1)
        id: app
        if: vars.HYGIENE_C2_MODE == 'live' && vars.HYGIENE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HYGIENE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HYGIENE_APP_PRIVATE_KEY }}
      - name: Stale agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
          HYGIENE_APP_TOKEN: ${{ steps.app.outputs.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_HEAD_GLOB: ${{ inputs.pr_head_glob }}
          CLOSE_AFTER: ${{ inputs.close_after }}
          EXEMPT_BASE_REFS: ${{ inputs.exempt_base_refs }}
          PR_STALE_DAYS: ${{ inputs.pr_stale_days }}
          PR_CLOSE_DAYS: ${{ inputs.pr_close_days }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C2_MODE }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref, *, mode="hygiene-manifest"):
              """Load denied paths from base manifest. Any failure fails closed (never skip)."""
              qpath = urllib.parse.quote(MANIFEST, safe="")
              qref = urllib.parse.quote(ref, safe="")
              path = f"/repos/{repo}/contents/{qpath}?ref={qref}"
              try:
                  raw = call(path, accept="application/vnd.github.raw")
              except HygieneAPIError as exc:
                  fail(mode, f"manifest unreadable at {ref}: {exc}")
              if not isinstance(raw, str) or not raw.strip():
                  fail(mode, f"manifest missing or empty at {ref}")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  fail(mode, f"manifest invalid JSON at {ref}")
              if not isinstance(data, dict):
                  fail(mode, f"manifest must be a JSON object at {ref}")
              dp = data.get("denied_paths") or {}
              if not isinstance(dp, dict):
                  fail(mode, "manifest denied_paths must be an object")
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C2 agent PR stale label/close (API-only). Issue stale uses actions/stale in workflow."""
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

              HOLD_LABELS,
              SPEC_LABELS,
              call,
              dry_run,
              fail,
              fetch_manifest_denied,
              paginate,
              path_matches_any,
          )

          MODE = "hygiene-c2-stale"
          PR_AUTHOR_DEFAULT = "Madgeniusblink"
          PR_HEAD_GLOB = "agent/**"
          CLOSE_MARKER = "<!-- hygiene:c2:close -->"
          STALE_LABEL = "stale"
          PT = ZoneInfo("America/Los_Angeles")


          def env(name, default=""):
              return os.environ.get(name, default)


          def parse_ts(s):
              if not s:
                  return None
              s = s.strip()
              if s.endswith("-07:00") or s.endswith("-08:00"):
                  wall = s[:-6]
                  return datetime.fromisoformat(wall).replace(tzinfo=PT)
              if s.endswith("Z"):
                  return datetime.fromisoformat(s.replace("Z", "+00:00"))
              try:
                  return datetime.fromisoformat(s)
              except ValueError:
                  return None


          def head_matches(ref, glob):
              if glob.endswith("/**"):
                  return ref.startswith(glob[:-3])
              return ref == glob


          def pr_exempt_labels(labels):
              names = {l.get("name") for l in labels or []}
              if names & HOLD_LABELS:
                  return "hold"
              if names & SPEC_LABELS:
                  return "spec-label"
              if "blocked" in names or "security" in names:
                  return "blocked-security"
              return None


          def event_timestamp(ev):
              et = ev.get("event")
              if et == "committed":
                  committer = ev.get("committer") or ev.get("author") or {}
                  if not committer.get("date"):
                      commit = ev.get("commit") or {}
                      committer = commit.get("committer") or commit.get("author") or committer
                  return parse_ts(committer.get("date")) or parse_ts(ev.get("created_at"))
              return parse_ts(ev.get("created_at") or ev.get("submitted_at"))


          def last_human_activity(token, repo, pr_number):
              events = paginate(f"/repos/{repo}/issues/{pr_number}/timeline", token=token, cap=30)
              latest = None
              for ev in events:
                  et = ev.get("event")
                  if et not in ("committed", "commented", "reviewed", "labeled", "unlabeled"):
                      continue
                  actor = (ev.get("actor") or {}).get("login") or ""
                  if actor.endswith("[bot]"):
                      continue
                  ts = event_timestamp(ev)
                  if ts and (latest is None or ts > latest):
                      latest = ts
              return latest


          def changed_protected(token, repo, pr_number, denied):
              files = paginate(f"/repos/{repo}/pulls/{pr_number}/files", token=token, cap=30)
              for f in files:
                  for path in (f.get("filename"), f.get("previous_filename")):
                      if path and path_matches_any(path, denied):
                          return True
              return False


          def close_allowed():
              raw = env("CLOSE_AFTER", "2026-10-12T00:00:00-07:00")
              dt = parse_ts(raw)
              if not dt:
                  return False
              return datetime.now(PT) >= dt


          def main():
              token = env("GH_TOKEN")
              app_token = env("HYGIENE_APP_TOKEN")
              repo = env("REPO")
              author = env("PR_AUTHOR", PR_AUTHOR_DEFAULT)
              head_glob = env("PR_HEAD_GLOB", PR_HEAD_GLOB)
              exempt_bases = {b.strip() for b in env("EXEMPT_BASE_REFS", "f6-gate-test").split(",") if b.strip()}
              stale_days = int(env("PR_STALE_DAYS", "7"))
              close_days = int(env("PR_CLOSE_DAYS", "14"))
              if not token:
                  fail(MODE, "GH_TOKEN missing")

              denied, _never = fetch_manifest_denied(repo, env("DEFAULT_BRANCH", "main"), mode=MODE)
              prs = paginate(f"/repos/{repo}/pulls?state=open", token=token, cap=50)
              now = datetime.now(ZoneInfo("UTC"))
              closed = 0
              labeled = 0

              for pr in prs:
                  if pr.get("draft"):
                      print("skipped:draft", pr["number"])
                      continue
                  user = (pr.get("user") or {}).get("login")
                  if user != author:
                      print("skipped:author", pr["number"])
                      continue
                  head = (pr.get("head") or {}).get("ref") or ""
                  if not head_matches(head, head_glob):
                      print("skipped:head", pr["number"])
                      continue
                  base = (pr.get("base") or {}).get("ref")
                  if base in exempt_bases:
                      print("skipped:base", pr["number"])
                      continue
                  ex = pr_exempt_labels(pr.get("labels"))
                  if ex:
                      print(f"skipped:{ex}", pr["number"])
                      continue
                  if changed_protected(token, repo, pr["number"], denied):
                      print("skipped:protected-path", pr["number"])
                      continue
                  activity = last_human_activity(token, repo, pr["number"])
                  if not activity:
                      activity = parse_ts(pr.get("created_at"))
                  if activity and activity.tzinfo is None:
                      activity = activity.replace(tzinfo=ZoneInfo("UTC"))
                  age_days = (now - activity.astimezone(ZoneInfo("UTC"))).total_seconds() / 86400.0
                  labels = {l.get("name") for l in pr.get("labels") or []}
                  if age_days < stale_days:
                      if STALE_LABEL in labels and not dry_run():
                          call(
                              f"/repos/{repo}/issues/{pr['number']}/labels/{STALE_LABEL}",
                              token=token,
                              method="DELETE",
                              allow_404=True,
                          )
                          print("removed stale", pr["number"])
                      continue
                  if STALE_LABEL not in labels:
                      if dry_run():
                          print("DRY-RUN stale label", pr["number"])
                      else:
                          call(
                              f"/repos/{repo}/issues/{pr['number']}/labels",
                              token=token,
                              method="POST",
                              body={"labels": [STALE_LABEL]},
                          )
                      labeled += 1
                  if age_days >= close_days and close_allowed():
                      if dry_run():
                          print("DRY-RUN close", pr["number"])
                      elif not app_token:
                          fail(MODE, "live close requires HYGIENE_APP_TOKEN (T1/K10); refusing GITHUB_TOKEN close")
                      else:
                          call(
                              f"/repos/{repo}/issues/{pr['number']}/comments",
                              token=app_token,
                              method="POST",
                              body={"body": f"Closing stale agent PR. {CLOSE_MARKER}"},
                          )
                          call(
                              f"/repos/{repo}/pulls/{pr['number']}",
                              token=app_token,
                              method="PATCH",
                              body={"state": "closed"},
                          )
                          closed += 1
              print(f"labeled={labeled} closed={closed}")


          if __name__ == "__main__":
              main()
          PY

  stale-issues:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C2_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          repo-token: ${{ github.token }}
          days-before-pr-stale: -1
          days-before-issue-stale: 30
          days-before-issue-close: ${{ vars.HYGIENE_C2_ISSUE_CLOSE == 'false' && -1 || 60 }}
          stale-issue-label: stale
          exempt-issue-labels: >-
            HOLD,DO NOT MERGE,spec:draft,spec:gate,spec:ready,in-progress,blocked,security,ci-red,policy-drift
          operations-per-run: 60
          debug-only: ${{ vars.HYGIENE_C2_MODE != 'live' }}
