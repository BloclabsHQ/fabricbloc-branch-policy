# Cost class: schedule/event (caller-defined)
#
# C1 reusable: Slack pr-ops notifier. Canonical script: hygiene/pr_ops_notify.py
# (embedded byte-identical; hygiene/sync_embedded_hygiene.py + hygiene-contract.yml).
name: hygiene-pr-ops-notify

on:
  workflow_call:
    inputs:
      channel:
        description: Slack channel id for pr-ops threads
        type: string
        default: C0C531H03M4
      alert_channel:
        description: Slack channel for delivery/token failures
        type: string
        default: C0C29LWFABZ
      skip_head_globs:
        description: Comma-separated head ref prefixes to skip (e.g. submodule bump)
        type: string
        default: ""
      marker_authors:
        description: Comma-separated logins allowed to own the marker comment
        type: string
        default: github-actions[bot]
      sweep:
        description: When true, reconcile open PRs on default branch
        type: boolean
        default: false
      default_branch:
        type: string
        default: main
    secrets:
      SLACK_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  plan:
    if: >-
      github.event_name != 'schedule' &&
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C1_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      event_action: ${{ steps.ctx.outputs.event_action }}
      do_notify: ${{ steps.ctx.outputs.do_notify }}
    steps:
      - name: Resolve event context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          do_notify=true
          pr=""
          action="${EVENT_ACTION:-}"
          case "$EVENT_NAME" in
            pull_request_target|pull_request)
              pr="${PR_NUMBER:-}"
              ;;
            workflow_run)
              pr="${WR_PR:-}"
              if [ -z "$pr" ] && [ -n "${WR_ID:-}" ]; then
                pr="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "${API}/repos/${REPO}/actions/runs/${WR_ID}" | python3 -c "import json,sys; d=json.load(sys.stdin); ps=d.get('pull_requests') or []; print(ps[0]['number'] if ps else '')")"
              fi
              action="workflow_run"
              ;;
            workflow_dispatch)
              action="dispatch"
              ;;
          esac
          echo "pr_number=${pr}" >> "$GITHUB_OUTPUT"
          echo "event_action=${action}" >> "$GITHUB_OUTPUT"
          echo "do_notify=${do_notify}" >> "$GITHUB_OUTPUT"

  notify:
    needs: plan
    if: >-
      needs.plan.outputs.do_notify == 'true' &&
      needs.plan.outputs.pr_number != '' &&
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C1_MODE != 'off'
    concurrency:
      group: hygiene-c1-${{ github.repository }}-${{ needs.plan.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: pr-ops notify
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          ALERT_CHANNEL: ${{ inputs.alert_channel }}
          SKIP_HEAD_GLOBS: ${{ inputs.skip_head_globs }}
          MARKER_AUTHORS: ${{ inputs.marker_authors }}
          SWEEP: ${{ inputs.sweep }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C1_MODE }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          EVENT_ACTION: ${{ needs.plan.outputs.event_action }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref, *, mode="hygiene-manifest"):
              """Load denied paths from base manifest. Any failure fails closed (never skip)."""
              qpath = urllib.parse.quote(MANIFEST, safe="")
              qref = urllib.parse.quote(ref, safe="")
              path = f"/repos/{repo}/contents/{qpath}?ref={qref}"
              try:
                  raw = call(path, accept="application/vnd.github.raw")
              except HygieneAPIError as exc:
                  fail(mode, f"manifest unreadable at {ref}: {exc}")
              if not isinstance(raw, str) or not raw.strip():
                  fail(mode, f"manifest missing or empty at {ref}")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  fail(mode, f"manifest invalid JSON at {ref}")
              if not isinstance(data, dict):
                  fail(mode, f"manifest must be a JSON object at {ref}")
              dp = data.get("denied_paths") or {}
              if not isinstance(dp, dict):
                  fail(mode, "manifest denied_paths must be an object")
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C1 pr-ops Slack notifier (logic aligned with fabricbloc #1562 scripts/pr-ops-notify.py @4967d8c).

          Uses GitHub REST + Slack Web API only. Never checks out PR head code.
          """
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request


          MODE = "hygiene-c1-pr-ops-notify"
          MARKER_RE = re.compile(
              r"<!--\s*fabricbloc-pr-ops-thread-ts=(?P<ts>\d+(?:\.\d+)?)"
              r"(?:\s+ready-sha=(?P<ready>[0-9a-f]{40}|))?"
              r"(?:\s+lifecycle=(?P<life>\w+))?\s*-->",
              re.I,
          )
          INTEGRATION_GITHUB_ACTIONS = 15368


          def env(name, default=""):
              return os.environ.get(name, default)


          def slack_post(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")


          def alert_fail(token, alert_channel, msg):
              if token and alert_channel:
                  try:
                      slack_post(token, alert_channel, f":rotating_light: {MODE}: {msg}")
                  except Exception:
                      pass
              fail(MODE, msg)


          def parse_marker(body):
              m = MARKER_RE.search(body or "")
              if not m:
                  return {}
              out = {"thread_ts": m.group("ts")}
              if m.group("ready"):
                  out["ready_sha"] = m.group("ready")
              if m.group("life"):
                  out["lifecycle"] = m.group("life").lower()
              return out


          def marker_comment(comments, authors):
              author_set = {a.strip().lower() for a in authors.split(",") if a.strip()}
              for c in comments:
                  login = ((c.get("user") or {}).get("login") or "").lower()
                  if author_set and login not in author_set:
                      continue
                  parsed = parse_marker(c.get("body"))
                  if parsed:
                      return c, parsed
              return None, {}


          def upsert_marker(token, repo, pr, comment_id, body):
              if comment_id:
                  call(
                      f"/repos/{repo}/issues/comments/{comment_id}",
                      token=token,
                      method="PATCH",
                      body={"body": body},
                  )
              else:
                  call(f"/repos/{repo}/issues/{pr}/comments", token=token, method="POST", body={"body": body})


          def build_marker(thread_ts, ready_sha=None, lifecycle=None):
              parts = [f"<!-- fabricbloc-pr-ops-thread-ts={thread_ts}"]
              if ready_sha:
                  parts.append(f" ready-sha={ready_sha}")
              if lifecycle:
                  parts.append(f" lifecycle={lifecycle}")
              parts.append(" -->")
              return "".join(parts)


          def skip_head(ref, globs):
              ref = ref or ""
              for g in globs:
                  g = g.strip()
                  if not g:
                      continue
                  if g.endswith("*"):
                      if ref.startswith(g[:-1]):
                          return True
                  elif ref == g:
                      return True
              return False


          def required_contexts(repo, base_ref):
              rules = call(f"/repos/{repo}/rules/branches/{urllib.parse.quote(base_ref, safe='')}")
              contexts = []
              for rule in rules or []:
                  if not isinstance(rule, dict):
                      continue
                  rtype = rule.get("type")
                  params = rule.get("parameters") or {}
                  if rtype == "required_status_checks":
                      for chk in params.get("required_status_checks") or []:
                          if isinstance(chk, dict) and chk.get("context"):
                              contexts.append(chk)
                  if rtype == "workflows":
                      for wf in (params.get("workflows") or []):
                          if isinstance(wf, dict) and wf.get("path"):
                              contexts.append({"context": wf["path"].split("/")[-1].replace(".yml", ""), "integration_id": INTEGRATION_GITHUB_ACTIONS})
              return contexts


          def checks_green(repo, sha, contexts):
              if not contexts:
                  return False, "no required contexts from rules API"
              combined = call(f"/repos/{repo}/commits/{sha}/check-runs?per_page=100")
              runs = (combined or {}).get("check_runs") or []
              statuses = call(f"/repos/{repo}/commits/{sha}/status")
              status_list = (statuses or {}).get("statuses") or []
              for ctx in contexts:
                  name = ctx.get("context")
                  iid = ctx.get("integration_id")
                  matched = False
                  for run in runs:
                      if run.get("name") != name:
                          continue
                      if iid is not None and run.get("app", {}).get("id") != iid:
                          continue
                      matched = True
                      if run.get("conclusion") != "success":
                          return False, f"check-run {name}={run.get('conclusion')}"
                      break
                  if matched:
                      continue
                  for st in status_list:
                      if st.get("context") != name:
                          continue
                      if iid is not None and (st.get("creator", {}) or {}).get("id") != iid:
                          continue
                      matched = True
                      if st.get("state") != "success":
                          return False, f"status {name}={st.get('state')}"
                      break
                  if not matched:
                      return False, f"missing context {name}"
              return True, "ok"


          def format_open(pr, repo):
              return (
                  f"*OPEN* `{repo}` PR #{pr['number']}: {pr.get('title')}\n"
                  f"{pr.get('html_url')}\n"
                  f"head `{pr.get('head', {}).get('ref')}` → `{pr.get('base', {}).get('ref')}`"
              )


          def format_ready(pr, repo):
              return f"*READY* `{repo}` PR #{pr['number']}: {pr.get('html_url')}"


          def format_closed(pr, repo, merged):
              tag = "MERGED" if merged else "CLOSED"
              return f"*{tag}* `{repo}` PR #{pr['number']}: {pr.get('html_url')}"


          def process_pr(token, slack_token, repo, pr_number, *, event_action=None, sweep=False):
              channel = env("CHANNEL", "C0C531H03M4")
              alert_channel = env("ALERT_CHANNEL", "C0C29LWFABZ")
              authors = env("MARKER_AUTHORS", "github-actions[bot]")
              skip_globs = [g for g in env("SKIP_HEAD_GLOBS", "").split(",") if g.strip()]
              is_dry = dry_run()

              pr = call(f"/repos/{repo}/pulls/{pr_number}", token=token)
              if not pr:
                  fail(MODE, f"PR #{pr_number} not found")

              head_ref = (pr.get("head") or {}).get("ref") or ""
              if skip_head(head_ref, skip_globs):
                  print(f"skip_head_glob ref={head_ref}")
                  return

              comments = paginate(f"/repos/{repo}/issues/{pr_number}/comments", token=token)
              marker_c, marker = marker_comment(comments, authors)
              thread_ts = marker.get("thread_ts")
              lifecycle = marker.get("lifecycle")

              merged = bool(pr.get("merged_at"))
              state = pr.get("state")
              draft = bool(pr.get("draft"))

              action = event_action or env("EVENT_ACTION", "")
              if sweep and state == "open":
                  action = action or "sweep"

              if state == "closed":
                  if lifecycle == "closed":
                      print("lifecycle already closed")
                      return
                  msg = format_closed(pr, repo, merged)
                  if is_dry:
                      print(f"DRY-RUN would post: {msg}")
                  else:
                      if not thread_ts:
                          thread_ts = slack_post(slack_token, channel, format_open(pr, repo))
                      slack_post(slack_token, channel, msg, thread_ts=thread_ts)
                      body = build_marker(thread_ts, marker.get("ready_sha"), lifecycle="closed")
                      upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)
                  return

              if not thread_ts and action in ("opened", "reopened", "ready_for_review", "sweep", ""):
                  msg = format_open(pr, repo)
                  if is_dry:
                      print(f"DRY-RUN would OPEN: {msg}")
                      thread_ts = "dry-run-ts"
                  else:
                      thread_ts = slack_post(slack_token, channel, msg)
                      body = build_marker(thread_ts)
                      upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)
                  if draft:
                      return

              head_sha = (pr.get("head") or {}).get("sha") or ""
              base_ref = (pr.get("base") or {}).get("ref") or "main"
              if draft:
                  return

              contexts = required_contexts(repo, base_ref)
              green, reason = checks_green(repo, head_sha, contexts)
              if not green:
                  print(f"not ready: {reason}")
                  return

              if not thread_ts:
                  print("READY skipped: no thread (READY never opens root)")
                  return

              # Re-read marker after checks (C1-2: avoid duplicate READY on concurrent runs).
              comments = paginate(f"/repos/{repo}/issues/{pr_number}/comments", token=token)
              marker_c, marker = marker_comment(comments, authors)
              thread_ts = marker.get("thread_ts") or thread_ts
              if marker.get("ready_sha") == head_sha:
                  print(f"ready-sha already {head_sha[:7]} (post-check re-read)")
                  return

              msg = format_ready(pr, repo)
              if is_dry:
                  print(f"DRY-RUN would READY: {msg}")
              else:
                  slack_post(slack_token, channel, msg, thread_ts=thread_ts)
                  body = build_marker(thread_ts, ready_sha=head_sha, lifecycle=marker.get("lifecycle"))
                  upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)


          def sweep_open_prs(token, slack_token, repo):
              prs = paginate(f"/repos/{repo}/pulls?state=open&base={env('DEFAULT_BRANCH', 'main')}", token=token, cap=20)
              for pr in prs:
                  process_pr(token, slack_token, repo, pr["number"], sweep=True)


          def main():
              token = env("GH_TOKEN")
              slack_token = env("SLACK_BOT_TOKEN")
              repo = env("REPO")
              if not token:
                  fail(MODE, "GH_TOKEN missing")
              if not slack_token:
                  alert_fail("", env("ALERT_CHANNEL", "C0C29LWFABZ"), "SLACK_BOT_TOKEN missing")

              try:
                  pr_number = env("PR_NUMBER")
                  if env("SWEEP", "").lower() in ("1", "true", "yes"):
                      sweep_open_prs(token, slack_token, repo)
                  elif pr_number:
                      process_pr(
                          token,
                          slack_token,
                          repo,
                          int(pr_number),
                          event_action=env("EVENT_ACTION"),
                      )
                  else:
                      fail(MODE, "PR_NUMBER or SWEEP required")
              except HygieneAPIError as exc:
                  alert_fail(slack_token, env("ALERT_CHANNEL", "C0C29LWFABZ"), str(exc))
              except RuntimeError as exc:
                  alert_fail(slack_token, env("ALERT_CHANNEL", "C0C29LWFABZ"), str(exc))


          if __name__ == "__main__":
              main()
          PY

  sweep:
    if: >-
      (github.event_name == 'schedule' || inputs.sweep) &&
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C1_MODE != 'off'
    concurrency:
      group: hygiene-c1-${{ github.repository }}-sweep
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: write
    steps:
      - name: Hourly sweep
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          ALERT_CHANNEL: ${{ inputs.alert_channel }}
          SKIP_HEAD_GLOBS: ${{ inputs.skip_head_globs }}
          MARKER_AUTHORS: ${{ inputs.marker_authors }}
          SWEEP: "true"
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C1_MODE }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref, *, mode="hygiene-manifest"):
              """Load denied paths from base manifest. Any failure fails closed (never skip)."""
              qpath = urllib.parse.quote(MANIFEST, safe="")
              qref = urllib.parse.quote(ref, safe="")
              path = f"/repos/{repo}/contents/{qpath}?ref={qref}"
              try:
                  raw = call(path, accept="application/vnd.github.raw")
              except HygieneAPIError as exc:
                  fail(mode, f"manifest unreadable at {ref}: {exc}")
              if not isinstance(raw, str) or not raw.strip():
                  fail(mode, f"manifest missing or empty at {ref}")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  fail(mode, f"manifest invalid JSON at {ref}")
              if not isinstance(data, dict):
                  fail(mode, f"manifest must be a JSON object at {ref}")
              dp = data.get("denied_paths") or {}
              if not isinstance(dp, dict):
                  fail(mode, "manifest denied_paths must be an object")
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C1 pr-ops Slack notifier (logic aligned with fabricbloc #1562 scripts/pr-ops-notify.py @4967d8c).

          Uses GitHub REST + Slack Web API only. Never checks out PR head code.
          """
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request


          MODE = "hygiene-c1-pr-ops-notify"
          MARKER_RE = re.compile(
              r"<!--\s*fabricbloc-pr-ops-thread-ts=(?P<ts>\d+(?:\.\d+)?)"
              r"(?:\s+ready-sha=(?P<ready>[0-9a-f]{40}|))?"
              r"(?:\s+lifecycle=(?P<life>\w+))?\s*-->",
              re.I,
          )
          INTEGRATION_GITHUB_ACTIONS = 15368


          def env(name, default=""):
              return os.environ.get(name, default)


          def slack_post(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")


          def alert_fail(token, alert_channel, msg):
              if token and alert_channel:
                  try:
                      slack_post(token, alert_channel, f":rotating_light: {MODE}: {msg}")
                  except Exception:
                      pass
              fail(MODE, msg)


          def parse_marker(body):
              m = MARKER_RE.search(body or "")
              if not m:
                  return {}
              out = {"thread_ts": m.group("ts")}
              if m.group("ready"):
                  out["ready_sha"] = m.group("ready")
              if m.group("life"):
                  out["lifecycle"] = m.group("life").lower()
              return out


          def marker_comment(comments, authors):
              author_set = {a.strip().lower() for a in authors.split(",") if a.strip()}
              for c in comments:
                  login = ((c.get("user") or {}).get("login") or "").lower()
                  if author_set and login not in author_set:
                      continue
                  parsed = parse_marker(c.get("body"))
                  if parsed:
                      return c, parsed
              return None, {}


          def upsert_marker(token, repo, pr, comment_id, body):
              if comment_id:
                  call(
                      f"/repos/{repo}/issues/comments/{comment_id}",
                      token=token,
                      method="PATCH",
                      body={"body": body},
                  )
              else:
                  call(f"/repos/{repo}/issues/{pr}/comments", token=token, method="POST", body={"body": body})


          def build_marker(thread_ts, ready_sha=None, lifecycle=None):
              parts = [f"<!-- fabricbloc-pr-ops-thread-ts={thread_ts}"]
              if ready_sha:
                  parts.append(f" ready-sha={ready_sha}")
              if lifecycle:
                  parts.append(f" lifecycle={lifecycle}")
              parts.append(" -->")
              return "".join(parts)


          def skip_head(ref, globs):
              ref = ref or ""
              for g in globs:
                  g = g.strip()
                  if not g:
                      continue
                  if g.endswith("*"):
                      if ref.startswith(g[:-1]):
                          return True
                  elif ref == g:
                      return True
              return False


          def required_contexts(repo, base_ref):
              rules = call(f"/repos/{repo}/rules/branches/{urllib.parse.quote(base_ref, safe='')}")
              contexts = []
              for rule in rules or []:
                  if not isinstance(rule, dict):
                      continue
                  rtype = rule.get("type")
                  params = rule.get("parameters") or {}
                  if rtype == "required_status_checks":
                      for chk in params.get("required_status_checks") or []:
                          if isinstance(chk, dict) and chk.get("context"):
                              contexts.append(chk)
                  if rtype == "workflows":
                      for wf in (params.get("workflows") or []):
                          if isinstance(wf, dict) and wf.get("path"):
                              contexts.append({"context": wf["path"].split("/")[-1].replace(".yml", ""), "integration_id": INTEGRATION_GITHUB_ACTIONS})
              return contexts


          def checks_green(repo, sha, contexts):
              if not contexts:
                  return False, "no required contexts from rules API"
              combined = call(f"/repos/{repo}/commits/{sha}/check-runs?per_page=100")
              runs = (combined or {}).get("check_runs") or []
              statuses = call(f"/repos/{repo}/commits/{sha}/status")
              status_list = (statuses or {}).get("statuses") or []
              for ctx in contexts:
                  name = ctx.get("context")
                  iid = ctx.get("integration_id")
                  matched = False
                  for run in runs:
                      if run.get("name") != name:
                          continue
                      if iid is not None and run.get("app", {}).get("id") != iid:
                          continue
                      matched = True
                      if run.get("conclusion") != "success":
                          return False, f"check-run {name}={run.get('conclusion')}"
                      break
                  if matched:
                      continue
                  for st in status_list:
                      if st.get("context") != name:
                          continue
                      if iid is not None and (st.get("creator", {}) or {}).get("id") != iid:
                          continue
                      matched = True
                      if st.get("state") != "success":
                          return False, f"status {name}={st.get('state')}"
                      break
                  if not matched:
                      return False, f"missing context {name}"
              return True, "ok"


          def format_open(pr, repo):
              return (
                  f"*OPEN* `{repo}` PR #{pr['number']}: {pr.get('title')}\n"
                  f"{pr.get('html_url')}\n"
                  f"head `{pr.get('head', {}).get('ref')}` → `{pr.get('base', {}).get('ref')}`"
              )


          def format_ready(pr, repo):
              return f"*READY* `{repo}` PR #{pr['number']}: {pr.get('html_url')}"


          def format_closed(pr, repo, merged):
              tag = "MERGED" if merged else "CLOSED"
              return f"*{tag}* `{repo}` PR #{pr['number']}: {pr.get('html_url')}"


          def process_pr(token, slack_token, repo, pr_number, *, event_action=None, sweep=False):
              channel = env("CHANNEL", "C0C531H03M4")
              alert_channel = env("ALERT_CHANNEL", "C0C29LWFABZ")
              authors = env("MARKER_AUTHORS", "github-actions[bot]")
              skip_globs = [g for g in env("SKIP_HEAD_GLOBS", "").split(",") if g.strip()]
              is_dry = dry_run()

              pr = call(f"/repos/{repo}/pulls/{pr_number}", token=token)
              if not pr:
                  fail(MODE, f"PR #{pr_number} not found")

              head_ref = (pr.get("head") or {}).get("ref") or ""
              if skip_head(head_ref, skip_globs):
                  print(f"skip_head_glob ref={head_ref}")
                  return

              comments = paginate(f"/repos/{repo}/issues/{pr_number}/comments", token=token)
              marker_c, marker = marker_comment(comments, authors)
              thread_ts = marker.get("thread_ts")
              lifecycle = marker.get("lifecycle")

              merged = bool(pr.get("merged_at"))
              state = pr.get("state")
              draft = bool(pr.get("draft"))

              action = event_action or env("EVENT_ACTION", "")
              if sweep and state == "open":
                  action = action or "sweep"

              if state == "closed":
                  if lifecycle == "closed":
                      print("lifecycle already closed")
                      return
                  msg = format_closed(pr, repo, merged)
                  if is_dry:
                      print(f"DRY-RUN would post: {msg}")
                  else:
                      if not thread_ts:
                          thread_ts = slack_post(slack_token, channel, format_open(pr, repo))
                      slack_post(slack_token, channel, msg, thread_ts=thread_ts)
                      body = build_marker(thread_ts, marker.get("ready_sha"), lifecycle="closed")
                      upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)
                  return

              if not thread_ts and action in ("opened", "reopened", "ready_for_review", "sweep", ""):
                  msg = format_open(pr, repo)
                  if is_dry:
                      print(f"DRY-RUN would OPEN: {msg}")
                      thread_ts = "dry-run-ts"
                  else:
                      thread_ts = slack_post(slack_token, channel, msg)
                      body = build_marker(thread_ts)
                      upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)
                  if draft:
                      return

              head_sha = (pr.get("head") or {}).get("sha") or ""
              base_ref = (pr.get("base") or {}).get("ref") or "main"
              if draft:
                  return

              contexts = required_contexts(repo, base_ref)
              green, reason = checks_green(repo, head_sha, contexts)
              if not green:
                  print(f"not ready: {reason}")
                  return

              if not thread_ts:
                  print("READY skipped: no thread (READY never opens root)")
                  return

              # Re-read marker after checks (C1-2: avoid duplicate READY on concurrent runs).
              comments = paginate(f"/repos/{repo}/issues/{pr_number}/comments", token=token)
              marker_c, marker = marker_comment(comments, authors)
              thread_ts = marker.get("thread_ts") or thread_ts
              if marker.get("ready_sha") == head_sha:
                  print(f"ready-sha already {head_sha[:7]} (post-check re-read)")
                  return

              msg = format_ready(pr, repo)
              if is_dry:
                  print(f"DRY-RUN would READY: {msg}")
              else:
                  slack_post(slack_token, channel, msg, thread_ts=thread_ts)
                  body = build_marker(thread_ts, ready_sha=head_sha, lifecycle=marker.get("lifecycle"))
                  upsert_marker(token, repo, pr_number, (marker_c or {}).get("id"), body)


          def sweep_open_prs(token, slack_token, repo):
              prs = paginate(f"/repos/{repo}/pulls?state=open&base={env('DEFAULT_BRANCH', 'main')}", token=token, cap=20)
              for pr in prs:
                  process_pr(token, slack_token, repo, pr["number"], sweep=True)


          def main():
              token = env("GH_TOKEN")
              slack_token = env("SLACK_BOT_TOKEN")
              repo = env("REPO")
              if not token:
                  fail(MODE, "GH_TOKEN missing")
              if not slack_token:
                  alert_fail("", env("ALERT_CHANNEL", "C0C29LWFABZ"), "SLACK_BOT_TOKEN missing")

              try:
                  pr_number = env("PR_NUMBER")
                  if env("SWEEP", "").lower() in ("1", "true", "yes"):
                      sweep_open_prs(token, slack_token, repo)
                  elif pr_number:
                      process_pr(
                          token,
                          slack_token,
                          repo,
                          int(pr_number),
                          event_action=env("EVENT_ACTION"),
                      )
                  else:
                      fail(MODE, "PR_NUMBER or SWEEP required")
              except HygieneAPIError as exc:
                  alert_fail(slack_token, env("ALERT_CHANNEL", "C0C29LWFABZ"), str(exc))
              except RuntimeError as exc:
                  alert_fail(slack_token, env("ALERT_CHANNEL", "C0C29LWFABZ"), str(exc))


          if __name__ == "__main__":
              main()
          PY
