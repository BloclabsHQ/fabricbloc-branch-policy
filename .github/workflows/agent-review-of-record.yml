          }
          # Co-authored-by: display names treated as agent identity (email still checked via is_agent).
          AGENT_COAUTHOR_NAMES = frozenset({
              "cursor agent", "cursoragent", "cursor", "chatgpt codex connector",
              "chatgpt-codex-connector[bot]", "claude", "claude[bot]",
          })
          COAUTHOR_TRAILER_RE = re.compile(r"^Co-authored-by:\s*(.+)$", re.MULTILINE | re.IGNORECASE)
          # GOV-0022 human handles (manifest operators.members_expected), lowercase GitHub logins.
          GOV_HUMAN_HANDLES = ("madgeniusblink",)
          HUMAN_BRANCH_TYPES = (
              "feat", "fix", "chore", "docs", "refactor", "test", "ci", "perf", "revert", "build", "style",
          )
          # Dedicated reviewer GitHub App (fabricbloc-reviewer). Login + numeric user id must both match.
