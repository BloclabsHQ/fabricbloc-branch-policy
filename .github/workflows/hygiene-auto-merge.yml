# Cost class: event (caller-defined)
name: hygiene-auto-merge

on:
  workflow_call:
    inputs:
      extra_protected_paths:
        type: string
        default: ""
      allow_dependabot:
        type: boolean
        default: true
      required_gate_path:
        type: string
        default: .github/workflows/agent-review-of-record.yml
      agent_gates_sha:
        description: pins.agent_gates_sha from canon.json
        type: string
        required: true
      default_branch:
        type: string
        default: main
    secrets:
      HYGIENE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  evaluate:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C3_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Mint hygiene App token (T1)
        id: app
        if: vars.HYGIENE_C3_MODE == 'live' && vars.HYGIENE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          app-id: ${{ vars.HYGIENE_APP_ID }}
          private-key: ${{ secrets.HYGIENE_APP_PRIVATE_KEY }}
      - name: Auto-merge evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          HYGIENE_APP_TOKEN: ${{ steps.app.outputs.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED_GATE_PATH: ${{ inputs.required_gate_path }}
          AGENT_GATES_SHA: ${{ inputs.agent_gates_sha }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C3_MODE }}
        run: |
          python3 - <<'PY'
          """Shared constants and GitHub API helpers for repo-hygiene scripts (stdlib only)."""
          import fnmatch
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SELF_REPO = "BloclabsHQ/fabricbloc-branch-policy"
          DEFAULT_BASE_REF = "main"
          MANIFEST = "agents/runtime/engine/policy/cursor-env/manifest.json"

          FLOOR_DENIED = [
              "agents/runtime/engine/",
              "agents/agents.yaml",
              ".github/workflows/",
              ".github/actions/",
              "decisions/",
              "architecture/decisions/",
              "CODEOWNERS",
              ".github/CODEOWNERS",
              "docs/CODEOWNERS",
          ]

          HYGIENE_EXTRA_PROTECTED = [
              "infra/",
              "ops/",
              "iac/",
              "**/iam/**",
              "**/*.tf",
              "architecture/SECRETS.md",
              "architecture/ENV_FILES.md",
              "policy/",
              "rulesets/",
          ]

          # Floor never_allowlist (manifest may extend; hygiene always applies proposed_additions).
          FLOOR_NEVER_ALLOWLIST = frozenset({
              "BloclabsHQ/fabric-iac",
              "BloclabsHQ/fabric-tss",
              "BloclabsHQ/fabric-contracts",
              "BloclabsHQ/fabric-auth",
              "BloclabsHQ/fabric-wallet",
              "BloclabsHQ/go-foundation",
              "BloclabsHQ/fabric-platform",
              "BloclabsHQ/github-actions",
              "BloclabsHQ/fabricbloc-branch-policy",
              "BloclabsHQ/context",
          })

          HOLD_LABELS = frozenset({"HOLD", "DO NOT MERGE"})
          SPEC_LABELS = frozenset({"spec:draft", "spec:gate", "spec:ready", "blocked", "security"})

          TARGET_REPOS = {"BloclabsHQ/fabricbloc"}

          MAX_PAGES = 100

          API = os.environ.get("API", "https://api.github.com").rstrip("/")
          TOKEN = os.environ.get("GH_TOKEN", "")


          def fail(mode, msg):
              print(f"::error::{mode}: {msg}")
              sys.exit(1)


          def call(path, *, token=None, accept="application/vnd.github+json", allow_404=False, method="GET", body=None):
              tok = token if token is not None else TOKEN
              data = None
              headers = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "fabricbloc-hygiene",
              }
              if body is not None:
                  data = json.dumps(body).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise HygieneAPIError(exc.code, path.split("?")[0])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise HygieneAPIError(0, f"{type(exc).__name__}") from exc
              if accept.endswith(".raw") or accept.endswith("+raw"):
                  return raw
              return json.loads(raw or "null")


          class HygieneAPIError(Exception):
              def __init__(self, code, path):
                  self.code = code
                  self.path = path
                  super().__init__(f"GitHub API {code} on {path}")


          def paginate(path, *, cap=MAX_PAGES, token=None):
              out, page = [], 1
              while page <= cap:
                  sep = "&" if "?" in path else "?"
                  chunk = call(f"{path}{sep}page={page}&per_page=100", token=token)
                  if not chunk:
                      break
                  if not isinstance(chunk, list):
                      break
                  out.extend(chunk)
                  if len(chunk) < 100:
                      break
                  page += 1
              if page > cap:
                  raise HygieneAPIError(0, f"pagination cap {cap} on {path.split('?')[0]}")
              return out


          def repo_short(full_name):
              return full_name.split("/", 1)[-1]


          def path_matches_any(path, patterns):
              path = path or ""
              for pat in patterns:
                  if fnmatch.fnmatch(path, pat) or path.startswith(pat.rstrip("*")):
                      return True
                  if pat.endswith("/") and path.startswith(pat):
                      return True
              return False


          def fetch_manifest_denied(repo, ref):
              try:
                  raw = call(
                      f"/repos/{repo}/contents/{urllib.parse.quote(MANIFEST, safe='')}?ref={urllib.parse.quote(ref, safe='')}",
                      accept="application/vnd.github.raw",
                  )
                  data = json.loads(raw)
              except (HygieneAPIError, json.JSONDecodeError, TypeError):
                  return list(FLOOR_DENIED), set(FLOOR_NEVER_ALLOWLIST)
              dp = (data.get("denied_paths") or {}) if isinstance(data, dict) else {}
              denied = list(FLOOR_DENIED)
              denied += list(dp.get("arch_0048_baseline") or [])
              denied += list(dp.get("proposed_additions") or [])
              denied += list(HYGIENE_EXTRA_PROTECTED)
              never = set(FLOOR_NEVER_ALLOWLIST)
              for name in data.get("never_allowlist") or []:
                  if isinstance(name, str):
                      never.add(name if "/" in name else f"BloclabsHQ/{name}")
              return denied, never


          def dry_run(mode_env=None):
              mode = (mode_env or os.environ.get("HYGIENE_MODE") or "dry-run").strip().lower()
              return mode == "dry-run"


          def hygiene_enabled(c_var, org_var=None):
              org = (org_var or os.environ.get("HYGIENE_ENABLED") or "").strip().lower()
              if org == "false":
                  return False
              mode = (c_var or os.environ.get("HYGIENE_MODE") or "").strip().lower()
              return mode != "off"


          MARKER_BOT_RE = re.compile(r"<!--\s*hygiene:([\w-]+):([^>]+)\s*-->")


          def slack_post_message(token, channel, text, thread_ts=None):
              payload = {"channel": channel, "text": text, "unfurl_links": False, "unfurl_media": False}
              if thread_ts:
                  payload["thread_ts"] = thread_ts
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.loads(resp.read().decode())
              if not body.get("ok"):
                  raise RuntimeError(body.get("error") or "slack error")
              return body.get("ts")

          #!/usr/bin/env python3
          """C3 auto-merge (evaluate + enable/disable via hygiene App token). Gated on canon-agent-gates."""
          import json
          import os

              FLOOR_NEVER_ALLOWLIST,
              HOLD_LABELS,
              TARGET_REPOS,
              HygieneAPIError,
              call,
              dry_run,
              fail,
              fetch_manifest_denied,
              paginate,
              path_matches_any,
          )

          MODE = "hygiene-c3-auto-merge"
          ENGINE_AUTHOR = "fabricbloc-agent-ops[bot]"


          def env(name, default=""):
              return os.environ.get(name, default)


          def gate_enforced(token, repo, base, gate_path, pin_sha):
              rules = call(f"/repos/{repo}/rules/branches/{base}", token=token) or []
              for rule in rules:
                  if rule.get("type") != "workflows":
                      continue
                  for wf in (rule.get("parameters") or {}).get("workflows") or []:
                      if wf.get("path") == gate_path and wf.get("sha") == pin_sha:
                          return True
              return False


          def pr_blocked(pr, denied):
              if pr.get("draft"):
                  return "draft"
              labels = {l.get("name") for l in pr.get("labels") or []}
              if labels & HOLD_LABELS:
                  return "hold"
              if "security" in labels:
                  return "security"
              head = (pr.get("head") or {}).get("ref") or ""
              if head.startswith("agent/autonomous/"):
                  return "engine-branch"
              user = (pr.get("user") or {}).get("login")
              if user == ENGINE_AUTHOR:
                  return "engine-author"
              return None


          def graphql(token, query, variables):
              return call(
                  "/graphql",
                  token=token,
                  method="POST",
                  body={"query": query, "variables": variables},
              )


          def disable_auto_merge(token, node_id):
              q = """
              mutation($id: ID!) {
                disablePullRequestAutoMerge(input: {pullRequestId: $id}) {
                  clientMutationId
                }
              }
              """
              graphql(token, q, {"id": node_id})


          def enable_auto_merge(token, node_id, head_oid):
              q = """
              mutation($id: ID!, $sha: GitObjectID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH, expectedHeadOid: $sha}) {
                  clientMutationId
                }
              }
              """
              print(f"enable expectedHeadOid={head_oid}")
              if dry_run():
                  return
              graphql(token, q, {"id": node_id, "sha": head_oid})


          def evaluate_pr(token, app_token, repo, pr_number, gate_path, agent_gates_sha, denied):
              pr = call(f"/repos/{repo}/pulls/{pr_number}", token=token)
              reason = pr_blocked(pr, denied)
              if reason:
                  print(f"skip:{reason}")
                  return
              files = paginate(f"/repos/{repo}/pulls/{pr_number}/files", token=token, cap=30)
              for f in files:
                  for path in (f.get("filename"), f.get("previous_filename")):
                      if path and path_matches_any(path, denied):
                          print("skip:protected-path")
                          return
              base = (pr.get("base") or {}).get("ref") or "main"
              if not gate_enforced(token, repo, base, gate_path, agent_gates_sha):
                  print("skip:gate-not-enforced")
                  return
              head_sha = (pr.get("head") or {}).get("sha")
              node = call(f"/repos/{repo}/pulls/{pr_number}", token=token).get("node_id")
              if not app_token:
                  print("skip:no-app-token")
                  return
              enable_auto_merge(app_token, node, head_sha)


          def main():
              token = env("GH_TOKEN")
              app_token = env("HYGIENE_APP_TOKEN")
              repo = env("REPO")
              gate_path = env("REQUIRED_GATE_PATH", ".github/workflows/agent-review-of-record.yml")
              agent_gates_sha = env("AGENT_GATES_SHA", "")
              pr_number = env("PR_NUMBER")
              if repo not in TARGET_REPOS:
                  print("skip:not-target-repo")
                  return
              if repo in FLOOR_NEVER_ALLOWLIST:
                  print("skip:never-allowlist")
                  return
              if not token:
                  fail(MODE, "GH_TOKEN missing")
              denied, never = fetch_manifest_denied(repo, env("DEFAULT_BRANCH", "main"))
              if pr_number:
                  evaluate_pr(token, app_token, repo, int(pr_number), gate_path, agent_gates_sha, denied)
              else:
                  print("summary-only dry-run reconcile")


          if __name__ == "__main__":
              main()
          PY
