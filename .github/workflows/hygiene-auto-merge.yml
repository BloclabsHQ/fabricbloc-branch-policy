# Cost class: event (caller-defined)
name: hygiene-auto-merge

on:
  workflow_call:
    inputs:
      extra_protected_paths:
        type: string
        default: ""
      allow_dependabot:
        type: boolean
        default: true
      required_gate_path:
        type: string
        default: .github/workflows/agent-review-of-record.yml
      agent_gates_sha:
        description: pins.agent_gates_sha from canon.json
        type: string
        required: true
      default_branch:
        type: string
        default: main
    secrets:
      HYGIENE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  evaluate:
    if: >-
      vars.HYGIENE_ENABLED != 'false' &&
      vars.HYGIENE_C3_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr="${PR_FROM_EVENT:-}"
          reconcile=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            reconcile=true
          fi
          if [ -z "$pr" ] && [ -n "${WR_ID:-}" ]; then
            pr="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${API}/repos/${REPO}/actions/runs/${WR_ID}" | python3 -c "import json,sys; d=json.load(sys.stdin); ps=d.get('pull_requests') or []; print(ps[0]['number'] if ps else '')")"
          fi
          if [ -z "$pr" ] && [ -n "${WR_PR:-}" ]; then
            pr="${WR_PR}"
          fi
          echo "pr_number=${pr}" >> "$GITHUB_OUTPUT"
          echo "reconcile=${reconcile}" >> "$GITHUB_OUTPUT"
      - name: Dependabot metadata
        id: dependabot
        if: >-
          inputs.allow_dependabot &&
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@0960109a4dd6d503321a0abfa87b9768962ddd12 # v2.4.0
        with:
          github-token: ${{ github.token }}
      - name: Mint hygiene App token (T1)
        id: app
        if: vars.HYGIENE_C3_MODE == 'live' && vars.HYGIENE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HYGIENE_APP_ID }}
          private-key: ${{ secrets.HYGIENE_APP_PRIVATE_KEY }}
      - name: Auto-merge evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          HYGIENE_APP_TOKEN: ${{ steps.app.outputs.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          RECONCILE: ${{ steps.ctx.outputs.reconcile }}
          EVENT_ACTION: ${{ github.event.action }}
          REQUIRED_GATE_PATH: ${{ inputs.required_gate_path }}
          AGENT_GATES_SHA: ${{ inputs.agent_gates_sha }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          HYGIENE_MODE: ${{ vars.HYGIENE_C3_MODE }}
          ALLOW_DEPENDABOT: ${{ inputs.allow_dependabot }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          EXTRA_PROTECTED_PATHS: ${{ inputs.extra_protected_paths }}
        run: |
          python3 - <<'PY'
          pass
          PY
